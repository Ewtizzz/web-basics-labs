<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказы - Food Construct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lunch.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Food Construct</h1>
    <nav class="nav">
      <a class="nav__link" href="index.html">О нас</a>
      <a class="nav__link" href="lunch.html">Собрать ланч</a>
      <a class="nav__link" href="order.html">Оформить заказ</a>
      <a class="nav__link" id="active" href="orders.html">Заказы</a>
      <a class="nav__link" href="#contacts">Контакты</a>
    </nav>
  </header>

  <main class="main">
    <section class="orders">
      <h2 class="menu__title">История заказов</h2>
      <p class="orders__empty">
        Заказов пока нет. Чтобы оформить первый, перейдите на страницу
        <a class="composition__link" href="lunch.html">Собрать ланч</a>.
      </p>
      <div class="orders-table-wrapper">
        <table class="orders-table">
          <thead>
            <tr>
              <th scope="col">№</th>
              <th scope="col">Дата оформления</th>
              <th scope="col">Состав заказа</th>
              <th scope="col">Стоимость</th>
              <th scope="col">Время доставки</th>
              <th scope="col">Действия</th>
            </tr>
          </thead>
          <tbody class="orders-table__body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer" id="contacts">
    <p class="footer__text">
      Позвонить нам <a class="footer__link" href="tel:+70000000000">+7-000-000-00-00</a>
    </p>
  </footer>

  <script src="js/dishes.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
